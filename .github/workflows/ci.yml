name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # The tests create their own database per run, so this user needs CREATEDB.
          # As the image's superuser it has it, and its default database is also tester.
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U tester"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict gridcheck
      - run: uv run pytest
